services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_kit_test
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_kit_test"]
      interval: 1s
      timeout: 5s
      retries: 30
